# Blueprint Render — 2 ambientes independientes (pruebas / producción)
# Nota free tier: 1 instancia PostgreSQL con 2 bases (pss_pruebas / pss_produccion)

databases:
  - name: pss-pruebas
    databaseName: pss_pruebas
    user: pss
    plan: free

services:
  - type: web
    name: clic-kiusys-pruebas
    runtime: docker
    repo: https://github.com/juangz1912/clic_kiusys
    branch: develop
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: pruebas
      - key: HOLD_MINUTES
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: pss-pruebas
          property: connectionString

  - type: web
    name: clic-kiusys-prod
    runtime: docker
    repo: https://github.com/juangz1912/clic_kiusys
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: produccion
      - key: HOLD_MINUTES
        value: "10"
      # DATABASE_URL: configurar en Render apuntando a pss_produccion (misma instancia PG)
