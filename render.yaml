# Blueprint Render — 2 ambientes independientes (pruebas / producción)
# Aplicar desde: Render Dashboard → Blueprints → New Blueprint → repo clic_kiusys

databases:
  - name: pss-pruebas
    databaseName: pss_pruebas
    user: pss
    plan: free

  - name: pss-produccion
    databaseName: pss_produccion
    user: pss
    plan: free

services:
  - type: web
    name: clic-kiusys-pruebas
    runtime: docker
    repo: https://github.com/juangz1912/clic_kiusys
    branch: develop
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: pruebas
      - key: HOLD_MINUTES
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: pss-pruebas
          property: connectionString

  - type: web
    name: clic-kiusys-prod
    runtime: docker
    repo: https://github.com/juangz1912/clic_kiusys
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: produccion
      - key: HOLD_MINUTES
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: pss-produccion
          property: connectionString
