services:
  db-pruebas:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pss
      POSTGRES_PASSWORD: pss
      POSTGRES_DB: pss_pruebas
    ports:
      - "5433:5432"
    volumes:
      - pg_pruebas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pss -d pss_pruebas"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-companion:
    build: ./companion_mocks
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api-pruebas:
    build: .
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: pruebas
      DATABASE_URL: postgresql://pss:pss@db-pruebas:5432/pss_pruebas
      HOLD_MINUTES: 10
      CLOUD_PROVIDER: oci
      OKE_CLUSTER_NAME: local-docker
      API_B_BASE_URL: http://aa11cf2e5dd814f8cbf7485099e3b46f-618055784.us-east-1.elb.amazonaws.com
      API_C_BASE_URL: http://medical-documents-api-34-123-58-136.sslip.io
      API_B_ANIMAL_PATH: /api/v2/animals
      API_B_ADOPTANTE_PATH: /api/v2/adoptantes
      API_B_ADOPCION_PATH: /api/v2/adopciones
      API_C_IMAGEN_PATH: /imagenes
      API_C_NOTA_PATH: /notas-medicas
      API_C_DOCUMENTO_PATH: /documentos-generados
      INTEGRATION_STUB_WHEN_UNREACHABLE: "false"
      PUBLIC_API_BASE_URL: http://localhost:8001
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_LOCAL_DIR: /data/object-storage
    volumes:
      - object_storage_data:/data/object-storage
    depends_on:
      db-pruebas:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db-produccion:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pss
      POSTGRES_PASSWORD: pss_prod
      POSTGRES_DB: pss_produccion
    ports:
      - "5434:5432"
    volumes:
      - pg_produccion:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pss -d pss_produccion"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-produccion:
    build: .
    ports:
      - "8002:8000"
    environment:
      ENVIRONMENT: produccion
      DATABASE_URL: postgresql://pss:pss_prod@db-produccion:5432/pss_produccion
      HOLD_MINUTES: 10
      CLOUD_PROVIDER: oci
      OKE_CLUSTER_NAME: local-docker-prod
      API_B_BASE_URL: http://aa11cf2e5dd814f8cbf7485099e3b46f-618055784.us-east-1.elb.amazonaws.com
      API_C_BASE_URL: http://medical-documents-api-34-123-58-136.sslip.io
      API_B_ANIMAL_PATH: /api/v2/animals
      API_B_ADOPTANTE_PATH: /api/v2/adoptantes
      API_B_ADOPCION_PATH: /api/v2/adopciones
      API_C_IMAGEN_PATH: /imagenes
      API_C_NOTA_PATH: /notas-medicas
      API_C_DOCUMENTO_PATH: /documentos-generados
      INTEGRATION_STUB_WHEN_UNREACHABLE: "false"
    depends_on:
      db-produccion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pg_pruebas:
  pg_produccion:
  object_storage_data:
