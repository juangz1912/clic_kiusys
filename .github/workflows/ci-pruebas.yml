name: CI Pruebas

on:
  push:
    branches: [develop, pruebas]
  pull_request:
    branches: [develop, pruebas]

env:
  RENDER_URL_PRUEBAS: https://clic-kiusys-pruebas.onrender.com

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: pruebas
      DATABASE_URL: postgresql://pss:pss@localhost:5432/pss_pruebas
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pss
          POSTGRES_PASSWORD: pss
          POSTGRES_DB: pss_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pss -d pss_pruebas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage gate (>= 60%)
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Build Docker image
        run: docker build -t clic-kiusys:pruebas .

      - name: Deploy pruebas stack (local smoke)
        run: docker compose up -d db-pruebas api-pruebas

      - name: Smoke test local pruebas API
        run: |
          for i in $(seq 1 12); do
            curl -sf http://localhost:8001/api/health && exit 0
            sleep 5
          done
          exit 1

      - name: Deploy to Render (pruebas)
        id: render_deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRUEBAS }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "RENDER_DEPLOY_HOOK_PRUEBAS no configurado; omitiendo deploy cloud"
            exit 0
          fi
          curl -f -X POST "$DEPLOY_HOOK"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.render_deploy.outputs.skipped != 'true'
        run: sleep 120

      - name: Smoke test cloud pruebas API
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.render_deploy.outputs.skipped != 'true'
        run: |
          for i in $(seq 1 12); do
            curl -sf "${{ env.RENDER_URL_PRUEBAS }}/api/health" && exit 0
            sleep 10
          done
          exit 1
