name: CI Produccion

on:
  push:
    branches: [main, master, produccion]
  pull_request:
    branches: [main, master, produccion]

env:
  RENDER_URL_PRODUCCION: https://clic-kiusys-prod.onrender.com

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: produccion
      DATABASE_URL: postgresql://pss:pss@localhost:5432/pss_produccion
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pss
          POSTGRES_PASSWORD: pss
          POSTGRES_DB: pss_produccion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pss -d pss_produccion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage gate (>= 85%)
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Build Docker image
        run: docker build -t clic-kiusys:produccion .

      - name: Deploy produccion stack (local smoke)
        run: docker compose up -d db-produccion api-produccion

      - name: Smoke test local produccion API
        run: |
          for i in $(seq 1 12); do
            curl -sf http://localhost:8002/api/health && exit 0
            sleep 5
          done
          exit 1

      - name: Deploy to Render (produccion)
        id: render_deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCCION }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "RENDER_DEPLOY_HOOK_PRODUCCION no configurado; omitiendo deploy cloud"
            exit 0
          fi
          curl -f -X POST "$DEPLOY_HOOK"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.render_deploy.outputs.skipped != 'true'
        run: sleep 120

      - name: Smoke test cloud produccion API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.render_deploy.outputs.skipped != 'true'
        run: |
          for i in $(seq 1 12); do
            curl -sf "${{ env.RENDER_URL_PRODUCCION }}/api/health" && exit 0
            sleep 10
          done
          exit 1
