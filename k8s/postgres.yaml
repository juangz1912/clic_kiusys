apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: clic-kiusys
type: Opaque
stringData:
  POSTGRES_USER: pss
  POSTGRES_PASSWORD: pss_prod
  POSTGRES_DB: pss_produccion
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: clic-kiusys
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: clic-kiusys
  labels:
    app: postgres
spec:
  replicas: 1
  # Volumen ReadWriteOnce: el pod viejo debe soltar el disco antes de crear el nuevo
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # El block volume OCI trae lost+found en la raíz; initdb exige directorio vacío
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pss", "-d", "pss_produccion"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clic-kiusys
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
