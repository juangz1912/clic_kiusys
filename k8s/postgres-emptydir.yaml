# Postgres sin PVC (kind/minikube). No usar en OKE producción.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: clic-kiusys
type: Opaque
stringData:
  POSTGRES_USER: pss
  POSTGRES_PASSWORD: pss_prod
  POSTGRES_DB: pss_produccion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: clic-kiusys
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pss", "-d", "pss_produccion"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clic-kiusys
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
