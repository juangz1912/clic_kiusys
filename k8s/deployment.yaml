apiVersion: apps/v1
kind: Deployment
metadata:
  name: clic-kiusys-api
  namespace: clic-kiusys
  labels:
    app: clic-kiusys-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clic-kiusys-api
  template:
    metadata:
      labels:
        app: clic-kiusys-api
    spec:
      initContainers:
        - name: wait-postgres
          image: docker.io/library/postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U pss; do echo "esperando postgres..."; sleep 2; done
      containers:
        - name: api
          image: ghcr.io/juangz1912/clic-kiusys:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: clic-kiusys-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clic-kiusys-api-secret
                  key: DATABASE_URL
            - name: API_B_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: clic-kiusys-api-secret
                  key: API_B_BASE_URL
            - name: API_C_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: clic-kiusys-api-secret
                  key: API_C_BASE_URL
            - name: PUBLIC_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: clic-kiusys-api-secret
                  key: PUBLIC_API_BASE_URL
                  optional: true
            - name: OCI_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: clic-kiusys-api-secret
                  key: OCI_S3_ACCESS_KEY_ID
                  optional: true
            - name: OCI_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clic-kiusys-api-secret
                  key: OCI_S3_SECRET_ACCESS_KEY
                  optional: true
            - name: OCI_OS_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: clic-kiusys-api-secret
                  key: OCI_OS_NAMESPACE
                  optional: true
          volumeMounts:
            - name: object-storage
              mountPath: /data/object-storage
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v2/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: object-storage
          emptyDir: {}
