services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pss
      POSTGRES_PASSWORD: pss
      POSTGRES_DB: pss_produccion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pss -d pss_produccion"]
      interval: 2s
      timeout: 3s
      retries: 30

  stable:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: clic-kiusys:canary
    environment:
      DATABASE_URL: postgresql://pss:pss@db:5432/pss_produccion
      APP_TRACK: stable
      APP_VERSION: v2
      PORT: "8000"
      ENVIRONMENT: pruebas
      CLOUD_PROVIDER: local
    depends_on:
      db:
        condition: service_healthy

  canary:
    image: clic-kiusys:canary
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://pss:pss@db:5432/pss_produccion
      APP_TRACK: canary
      APP_VERSION: v3
      PORT: "8000"
      ENVIRONMENT: pruebas
      CLOUD_PROVIDER: local
    depends_on:
      db:
        condition: service_healthy
      stable:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - stable
      - canary
