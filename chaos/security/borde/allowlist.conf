# Borde endurecido (experimento 2). Solo sale a internet lo que el flujo publico usa.
# Lo administrativo responde 404 en el borde, sin llegar al proceso.
# nginx normaliza el URI (%2e, .., //) antes de elegir location.
location ^~ /internal/ { return 404; }
location = /docs { return 404; }
location = /redoc { return 404; }
location = /openapi.json { return 404; }

location ^~ /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = / {
    proxy_pass http://api;
    proxy_set_header Host $host;
}

location / { return 404; }
