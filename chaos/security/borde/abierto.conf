# Borde tal como esta hoy: el mismo reparto de canary/compose/nginx.conf.template
# y del listener del balanceador de OCI. Todo lo que llega se reenvia, incluido /internal/*.
# El experimento 2 usa este archivo como la deriva de configuracion que se inyecta.
location / {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
